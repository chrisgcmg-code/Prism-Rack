name: Build Windows VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPRISM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Render tests
        run: build\PrismRenderTest_artefacts\Release\PrismRenderTest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PrismRack-VST3-Windows
          path: build/PrismRack_artefacts/Release/VST3/
